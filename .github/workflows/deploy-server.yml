name: Deploy servidor (worker + scrapling)

# DESABILITADO o gatilho automatico em push: faltam os secrets (SERVER_HOST/USER/SSH_KEY)
# e o `git pull` nao funciona no VPS (sem credencial do GitHub). O deploy do worker/scrapling
# e feito manualmente via SFTP + `docker compose up -d --build`. Para rodar este workflow
# sob demanda (apos configurar secrets + auth git no VPS), use "Run workflow" na aba Actions.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/minerador
            git pull origin master
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker system prune -f
            echo "Deploy concluido: $(date)"
