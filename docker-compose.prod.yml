services:

  postgres:
    image: postgres:16-alpine
    container_name: minerador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minerador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-minerador}
    # Porta exposta publicamente para o frontend Vercel conectar.
    # Proteção: senha forte de 32+ chars em POSTGRES_PASSWORD.
    ports:
      - "5432:5432"
    volumes:
      - minerador_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minerador} -d ${POSTGRES_DB:-minerador}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Tuning leve para o polling do pg-boss não custar caro em I/O.
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: minerador_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SCRAPLING_URL: http://scrapling:8000
      SCRAPLING_SHARED_SECRET: ${SCRAPLING_SHARED_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      PGBOSS_SCHEMA: pgboss
    depends_on:
      postgres:
        condition: service_healthy
      scrapling:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scrapling:
    build:
      context: ./scrapling
      dockerfile: Dockerfile
    container_name: minerador_scrapling
    restart: unless-stopped
    environment:
      SCRAPLING_SHARED_SECRET: ${SCRAPLING_SHARED_SECRET}
      SCRAPLING_LOG_LEVEL: info
      SCRAPLING_HEADLESS: "true"
      SCRAPLING_MAX_CONCURRENCY: "2"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    shm_size: 1gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  minerador_pgdata:
